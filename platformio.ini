; ESP32-S3-Touch-AMOLED-2.16 (Waveshare)
; ESP32-S3R8: 8MB OPI PSRAM + 16MB Flash

; 微雪 GFX 库（1.6.4）需要 Arduino core 3.x，官方 espressif32 平台只有 2.0.x，
; 故用社区 pioarduino 平台（Arduino 3.1 / IDF 5.4）
[env:esp32-s3-amoled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
; 微雪官方配套库（GFX_Library_for_Arduino / XPowersLib / SensorLib / lvgl 9）
lib_extra_dirs =
    vendor/waveshare-demo/examples/arduino/libraries
